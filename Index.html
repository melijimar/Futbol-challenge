<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fútbol Challenge</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130b;font-family:Arial,sans-serif;touch-action:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#163d20}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(0,0,0,.68);color:white;padding:8px 16px;border-radius:18px;font-weight:bold;font-size:clamp(14px,3vw,22px);z-index:3;white-space:nowrap}
#hud .score{font-size:1.25em}
#start,#end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:10}
.panel{width:min(90vw,420px);text-align:center;color:white;background:linear-gradient(145deg,#0b5b2a,#092d18);border:2px solid rgba(255,255,255,.25);border-radius:24px;padding:28px 22px;box-shadow:0 15px 50px rgba(0,0,0,.5)}
h1{font-size:clamp(30px,9vw,54px);margin:0 0 10px;text-shadow:0 4px 0 #063516}
.panel p{font-size:16px;line-height:1.45;opacity:.9}
button{border:0;border-radius:14px;padding:14px 25px;font-size:18px;font-weight:bold;color:white;background:#f39c12;box-shadow:0 5px 0 #9b5d06;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #9b5d06}
#end{display:none}
.diffRow{display:flex;gap:8px;justify-content:center;margin:14px 0}
.diffBtn{flex:1;padding:10px 6px;font-size:14px;background:#2c5f3a;box-shadow:0 4px 0 #163a20;border:2px solid transparent}
.diffBtn.sel{background:#f39c12;box-shadow:0 4px 0 #9b5d06;border-color:#fff}
#controls{position:absolute;inset:0;z-index:5;pointer-events:none}
#joyBase{position:absolute;left:22px;bottom:calc(24px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 3px 10px #0008}
.actions{position:absolute;right:22px;bottom:calc(25px + env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
.action{width:82px;height:82px;border-radius:50%;padding:0;font-size:14px;border:2px solid rgba(255,255,255,.4)}
#shoot{background:#e74c3c;box-shadow:0 5px 0 #8d261c}
#pass{background:#3498db;box-shadow:0 5px 0 #1d5a80}
#msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:4;color:#fff;font-weight:900;font-size:clamp(28px,8vw,60px);text-shadow:0 4px 8px #000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="hud"><span>⚽ FÚTBOL CHALLENGE</span><span class="score"><b id="home">0</b> - <b id="away">0</b></span><span>⏱️ <b id="time">90</b></span></div>
<div id="msg"></div>

<div id="controls">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="actions">
    <button class="action" id="pass">PASE</button>
    <button class="action" id="shoot">DISPARO</button>
  </div>
</div>

<div id="start"><div class="panel">
<h1>⚽ FÚTBOL<br>CHALLENGE</h1>
<p>¡Marca más goles que el rival antes de que termine el partido!</p>
<div class="diffRow">
  <button class="diffBtn" data-d="0.72">FÁCIL</button>
  <button class="diffBtn sel" data-d="1">NORMAL</button>
  <button class="diffBtn" data-d="1.35">DIFÍCIL</button>
</div>
<p>🎮 El control cambia solo al jugador más cercano al balón (anillo amarillo).<br>🔵 PASE &nbsp; 🔴 DISPARO</p>
<button id="startBtn">JUGAR</button>
</div></div>

<div id="end"><div class="panel">
<h1 id="result">¡PARTIDO TERMINADO!</h1>
<p id="finalScore"></p>
<button id="again">JUGAR DE NUEVO</button>
</div></div>
</div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const homeEl=document.getElementById('home'),awayEl=document.getElementById('away'),timeEl=document.getElementById('time');
const start=document.getElementById('start'),end=document.getElementById('end'),result=document.getElementById('result'),finalScore=document.getElementById('finalScore'),msg=document.getElementById('msg');
let W,H,field={x:0,y:0,w:0,h:0};
let running=false,scoreH=0,scoreA=0,timeLeft=90,last=0,raf;
let joy={x:0,y:0,active:false,id:null},keys={};
let teammates,controlled=0,ball,opponents,keeper,protect=0;
let difficulty=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// difficulty selector
document.querySelectorAll('.diffBtn').forEach(btn=>{
 btn.addEventListener('click',()=>{
   document.querySelectorAll('.diffBtn').forEach(b=>b.classList.remove('sel'));
   btn.classList.add('sel');difficulty=parseFloat(btn.dataset.d);
 });
});

// Field always keeps a real "pitch" shape (wide, not tall) no matter how the phone is held,
// so directions/shots/passes always behave the same and running looks natural.
function resize(){
 canvas.width=innerWidth*devicePixelRatio; canvas.height=innerHeight*devicePixelRatio;
 canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
 const ratio=1.55;
 let fw=W*.92,fh=fw/ratio;
 if(fh>H*.80){fh=H*.80;fw=fh*ratio}
 field={x:(W-fw)/2,y:(H-fh)/2,w:fw,h:fh};
}
addEventListener('resize',resize);resize();

function reset(){
 scoreH=scoreA=0;timeLeft=90;homeEl.textContent=0;awayEl.textContent=0;timeEl.textContent=90;
 const cy=field.y+field.h/2;
 teammates=[
  {x:field.x+field.w*.25,y:cy,r:16,num:10,offset:0,bob:0},
  {x:field.x+field.w*.16,y:cy-field.h*.22,r:16,num:7,offset:-field.h*.22,bob:0},
  {x:field.x+field.w*.16,y:cy+field.h*.22,r:16,num:9,offset:field.h*.22,bob:0}
 ];
 controlled=0;protect=0;
 ball={x:teammates[0].x+22,y:teammates[0].y,r:9,vx:0,vy:0,owner:null,holder:-1};
 opponents=[
 {x:field.x+field.w*.55,y:cy-field.h*.24,r:17,s:78*difficulty,zoneY:-field.h*.24,zoneXFrac:.58},
 {x:field.x+field.w*.65,y:cy+field.h*.24,r:17,s:70*difficulty,zoneY:field.h*.24,zoneXFrac:.66},
 {x:field.x+field.w*.75,y:cy,r:17,s:82*difficulty,zoneY:0,zoneXFrac:.76}
 ];
 opponents.forEach(o=>o.bob=0);
 keeper={x:field.x+field.w*.91,y:cy,r:20};
 msg.style.opacity=0;
}
function startGame(){reset();start.style.display='none';end.style.display='none';running=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function finish(){
 running=false;end.style.display='flex';
 result.textContent=scoreH>scoreA?'🏆 ¡VICTORIA!':scoreH<scoreA?'😢 ¡DERROTA!':'🤝 ¡EMPATE!';
 finalScore.textContent=`Resultado final: ${scoreH} - ${scoreA}`;
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('again').onclick=startGame;

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();shoot()}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob');
function joyMove(e){
 const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),max=r.width*.34;
 if(d>max){dx*=max/d;dy*=max/d}
 joy.x=dx/max;joy.y=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
base.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;base.setPointerCapture(e.pointerId);joyMove(e)});
base.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)joyMove(e)});
function joyUp(){joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}
base.addEventListener('pointerup',joyUp);base.addEventListener('pointercancel',joyUp);
document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
document.getElementById('pass').addEventListener('pointerdown',e=>{e.preventDefault();passBall()});

function shoot(){
 if(!running)return;
 const cp=teammates[controlled];
 if(!(ball.owner==='player'||dist(ball,cp)<60))return;
 const dx=field.x+field.w-cp.x, dy=(field.y+field.h/2)-cp.y;
 const len=Math.hypot(dx,dy)||1;
 ball.owner=null;ball.holder=-1;protect=0;
 ball.x=cp.x;ball.y=cp.y;
 const power=650;
 ball.vx=dx/len*power;ball.vy=dy/len*power;
}
function passBall(){
 if(!running)return;
 const cp=teammates[controlled];
 if(!(ball.owner==='player'||dist(ball,cp)<60))return;
 let target=null,bestScore=-Infinity;
 teammates.forEach((t,i)=>{
   if(i===controlled)return;
   const score=(t.x-cp.x)-Math.abs(t.y-cp.y)*.3;
   if(score>bestScore){bestScore=score;target=t}
 });
 ball.owner=null;ball.holder=-1;protect=0;
 ball.x=cp.x;ball.y=cp.y;
 if(target){
   const dx=target.x-cp.x,dy=target.y-cp.y,len=Math.hypot(dx,dy)||1;
   const power=clamp(len*1.4,220,480);
   ball.vx=dx/len*power;ball.vy=dy/len*power;
 } else {
   ball.vx=260;ball.vy=(field.y+field.h/2-cp.y)*1.3;
 }
}
function scoreGoal(team){
 if(team==='home')scoreH++;else scoreA++;
 homeEl.textContent=scoreH;awayEl.textContent=scoreA;
 msg.textContent=team==='home'?'⚽ ¡GOOOOL!':'😱 ¡GOL DEL RIVAL!';
 msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,900);
 resetPositions();
}
function resetPositions(){
 const cy=field.y+field.h/2;
 teammates[0].x=field.x+field.w*.25;teammates[0].y=cy;
 teammates[1].x=field.x+field.w*.16;teammates[1].y=cy-field.h*.22;
 teammates[2].x=field.x+field.w*.16;teammates[2].y=cy+field.h*.22;
 controlled=0;protect=0;
 ball.x=teammates[0].x+25;ball.y=cy;ball.vx=ball.vy=0;ball.owner=null;ball.holder=-1;
 opponents[0].x=field.x+field.w*.55;opponents[0].y=cy-field.h*.24;
 opponents[1].x=field.x+field.w*.65;opponents[1].y=cy+field.h*.24;
 opponents[2].x=field.x+field.w*.75;opponents[2].y=cy;
 keeper.y=cy;
}
function separate(list){
 for(let iter=0;iter<3;iter++){
   for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
     const a=list[i],b=list[j];
     let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
     const minD=a.r+b.r+14;
     if(d<minD){
       if(d<0.01){dx=(Math.random()-.5);dy=(Math.random()-.5);d=Math.hypot(dx,dy)||1}
       const push=(minD-d)/2,ux=dx/d,uy=dy/d;
       a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;
     }
   }
 }
 list.forEach(p=>{p.x=clamp(p.x,field.x+p.r,field.x+field.w-p.r);p.y=clamp(p.y,field.y+p.r,field.y+field.h-p.r)});
}
function moveEntity(e,tx,ty,spd,dt){
 const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
 const before=d;
 e.x+=dx/d*Math.min(spd*dt,d);e.y+=dy/d*Math.min(spd*dt,d);
 const moved=Math.hypot(dx/d*Math.min(spd*dt,d),dy/d*Math.min(spd*dt,d));
 e.bob=(e.bob||0)+ (moved>0.3? dt*16 : 0);
}
function update(dt){
 const cy=field.y+field.h/2;
 protect=Math.max(0,protect-dt);
 if(ball.owner!=='player'){
   ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.55,dt);ball.vy*=Math.pow(.55,dt);
   if(ball.y<field.y+10||ball.y>field.y+field.h-10)ball.vy*=-.65;
   if(ball.x<field.x+10)ball.vx*=-.65;
 }
 if(!ball.owner){
   for(let i=0;i<teammates.length;i++){
     if(dist(ball,teammates[i])<32){ball.owner='player';ball.holder=i;ball.vx=ball.vy=0;protect=.4;break}
   }
 }
 if(ball.owner==='player'){
   controlled=ball.holder;
 } else {
   let best=controlled,bestD=dist(ball,teammates[controlled]);
   teammates.forEach((t,i)=>{
     if(i===controlled)return;
     const d=dist(ball,t);
     if(d<bestD-15){best=i;bestD=d}
   });
   controlled=best;
 }
 let ax=joy.x,ay=joy.y;
 if(keys['arrowleft']||keys['a'])ax=-1;if(keys['arrowright']||keys['d'])ax=1;
 if(keys['arrowup']||keys['w'])ay=-1;if(keys['arrowdown']||keys['s'])ay=1;
 const mag=Math.hypot(ax,ay);if(mag>1){ax/=mag;ay/=mag}
 const speed=230;
 const cp=teammates[controlled];
 const px=clamp(cp.x+ax*speed*dt,field.x+22,field.x+field.w-22);
 const py=clamp(cp.y+ay*speed*dt,field.y+22,field.y+field.h-22);
 if(mag>0.1)cp.bob=(cp.bob||0)+dt*16;
 cp.x=px;cp.y=py;
 if(ball.owner==='player'){ball.x=cp.x+24;ball.y=cp.y}
 teammates.forEach((t,i)=>{
   if(i===controlled)return;
   const tx=clamp(ball.x-90,field.x+30,field.x+field.w-30);
   const ty=clamp(cy+t.offset*.85+(ball.y-cy)*.3,field.y+30,field.y+field.h-30);
   moveEntity(t,tx,ty,120,dt);
 });
 opponents.forEach((o,i)=>{
   const zoneX=clamp(field.x+field.w*o.zoneXFrac+(ball.x-(field.x+field.w*.5))*.2,field.x+field.w*.42,field.x+field.w-35);
   const zoneY=clamp(cy+o.zoneY+(ball.y-cy)*.35,field.y+25,field.y+field.h-25);
   let tx,ty;
   if(i===0){
     if(ball.owner==='player'){tx=cp.x;ty=cp.y} else {tx=ball.x;ty=ball.y}
   } else {
     tx=zoneX*.7+ball.x*.3;ty=zoneY*.7+ball.y*.3;
   }
   moveEntity(o,clamp(tx,field.x+field.w*.40,field.x+field.w-35),clamp(ty,field.y+25,field.y+field.h-25),o.s,dt);
 });
 separate([...teammates,...opponents,keeper]);
 opponents.forEach(o=>{
   if(protect<=0&&ball.owner==='player'&&dist(o,cp)<30){
     ball.owner='rival';ball.holder=-1;ball.x=o.x-20;ball.y=o.y;
   }
 });
 if(ball.owner==='rival'){
   const o=opponents[0];ball.x=o.x-20;ball.y=o.y;
   if(o.x<field.x+field.w*.48){ball.owner=null;ball.vx=-300;ball.vy=(cy-o.y)*1.2}
   else if(Math.random()<dt*.7*difficulty){ball.owner=null;ball.vx=-360;ball.vy=(cy-o.y)*1.2}
 }
 keeper.y+=clamp(ball.y-keeper.y,-150*dt,150*dt);
 keeper.y=clamp(keeper.y,field.y+55,field.y+field.h-55);
 if(ball.x>field.x+field.w-30 && Math.abs(ball.y-cy)<field.h*.13){scoreGoal('home');return}
 if(ball.x<field.x+30 && Math.abs(ball.y-cy)<field.h*.13){scoreGoal('away');return}
 if(ball.vx>0 && dist(ball,keeper)<30){ball.vx=-Math.abs(ball.vx)*.75;ball.vy+=(ball.y-keeper.y)*3}
 timeLeft-=dt;timeEl.textContent=Math.max(0,Math.ceil(timeLeft));
 if(timeLeft<=0)finish();
}
function circle(x,y,r,fill,stroke){
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
}
function drawPlayer(p,fill,ringColor,label){
 const squash=1+Math.sin(p.bob||0)*.14;
 ctx.beginPath();ctx.ellipse(p.x,p.y+p.r*.75,p.r*.85,p.r*.32,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fill();
 if(ringColor){circle(p.x,p.y,p.r+5,'rgba(241,196,15,0)','#f1c40f')}
 ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,squash);ctx.translate(-p.x,-p.y);
 circle(p.x,p.y,p.r,fill,'#fff');
 ctx.restore();
 circle(p.x,p.y-4,7,'#f5d6b3');
 if(label!=null){ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(String(label),p.x,p.y+4)}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#155d2b';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#247b39';ctx.fillRect(field.x,field.y,field.w,field.h);
 for(let i=0;i<10;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.025)':'rgba(0,0,0,.025)';ctx.fillRect(field.x+i*field.w/10,field.y,field.w/10,field.h)}
 ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.strokeRect(field.x,field.y,field.w,field.h);
 ctx.beginPath();ctx.moveTo(field.x+field.w/2,field.y);ctx.lineTo(field.x+field.w/2,field.y+field.h);ctx.stroke();
 ctx.beginPath();ctx.arc(field.x+field.w/2,field.y+field.h/2,field.h*.13,0,Math.PI*2);ctx.stroke();
 const cy=field.y+field.h/2, boxH=field.h*.42,boxW=field.w*.14;
 ctx.strokeRect(field.x,cy-boxH/2,boxW,boxH);ctx.strokeRect(field.x+field.w-boxW,cy-boxH/2,boxW,boxH);
 ctx.strokeRect(field.x,cy-boxH*.25,boxW*.42,boxH*.5);ctx.strokeRect(field.x+field.w-boxW*.42,cy-boxH*.25,boxW*.42,boxH*.5);
 ctx.fillStyle='#eee';ctx.fillRect(field.x-12,cy-field.h*.12,12,field.h*.24);ctx.fillRect(field.x+field.w,cy-field.h*.12,12,field.h*.24);
 teammates.forEach((t,i)=>drawPlayer(t,'#e74c3c',i===controlled,t.num));
 opponents.forEach(o=>drawPlayer(o,'#2980db',false,null));
 drawPlayer(keeper,'#f1c40f',false,null);
 circle(ball.x,ball.y,ball.r,'#fff','#222');ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ball.x,ball.y,3,0,Math.PI*2);ctx.stroke();
}
function loop(now){
 if(!running)return;let dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();raf=requestAnimationFrame(loop)
}
reset();draw();
</script>
</body>
</html>
